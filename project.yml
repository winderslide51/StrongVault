# Spéc XcodeGen → génère StrongClone.xcodeproj (non commité, cf .gitignore).
# Régénérer : `xcodegen generate`. Nécessite Xcode complet (donc CI ou poste avec Xcode).
name: StrongClone
options:
  bundleIdPrefix: dev.strongclone
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  # Package Core local (Swift pur, testable). KDBXKit (change `kdbx-read`) est tiré
  # **transitivement** via ce package (déclaré dans Package.swift) : l'app n'importe pas
  # KDBXKit directement, seul Core le fait.
  StrongCloneCore:
    path: .
  # SDK Google Drive (change `google-drive`) : utilisé UNIQUEMENT par la cible App
  # (`GoogleDriveClientLive`), pas par le Core → le Core reste sans dépendance SDK.
  GoogleDriveClient:
    url: https://github.com/darrarski/swift-google-drive-client
    from: 0.12.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Info.plist synthétisé par Xcode depuis les clés INFOPLIST_KEY_* (pas de fichier commité).
    GENERATE_INFOPLIST_FILE: YES

targets:
  StrongClone:
    type: application
    platform: iOS
    sources:
      - path: App
    # Valeurs OAuth Drive injectées par xcconfig : le fichier commité est vide, les valeurs
    # réelles viennent de `Config/GoogleDrive.xcconfig.local` (non commité). Aucun secret
    # dans le repo (CLAUDE.md §4/§6) — le clientID PKCE reste hors dépôt par principe.
    configFiles:
      Debug: Config/GoogleDrive.xcconfig
      Release: Config/GoogleDrive.xcconfig
    # Info.plist généré par XcodeGen (non commité) : porte les clés custom Drive et le
    # scheme de redirection OAuth ($(VAR) résolus au build depuis l'xcconfig). Les clés
    # standard restent synthétisées via INFOPLIST_KEY_* (GENERATE_INFOPLIST_FILE).
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GoogleDriveClientID: "$(GOOGLE_DRIVE_CLIENT_ID)"
        GoogleDriveRedirectURI: "$(GOOGLE_DRIVE_REDIRECT_SCHEME)://"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: google-drive-oauth
            CFBundleURLSchemes:
              - "$(GOOGLE_DRIVE_REDIRECT_SCHEME)"
    dependencies:
      - package: StrongCloneCore
        product: StrongCloneCore
      - package: GoogleDriveClient
        product: GoogleDriveClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.strongclone.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Familles d'appareils : 1 = iPhone uniquement (cf. périmètre v1).
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Déverrouiller votre base de mots de passe avec Face ID."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"

  StrongCloneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: StrongClone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.strongclone.app.tests

schemes:
  StrongClone:
    build:
      targets:
        StrongClone: all
        StrongCloneTests: [test]
    test:
      targets:
        - StrongCloneTests
      gatherCoverageData: true
